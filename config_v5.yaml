# Для моделей v5_cic_*
# =============================================================================
# Модели
# Варианты ru: v5_cis_base_nostress (рекомендуется), v5_cis_base, v5_cis_ext
# Варианты en: v3_en, v3_en_indic, v3_de
# =============================================================================
ru_model: "v5_cis_base_nostress"
en_model: "v3_en"

# =============================================================================
# Голоса
# Русские голоса:
# v5_cis_base_nostress (null = автоопределение)
# Мужские:
#   ru_roman ru_alexandr ru_miyau ru_bogdan ru_safarhuja  # В порядке качества
#   ru_dmitriy ru_gamat ru_igor ru_marat ru_eduard ru_kejilgan ru_sibday # не очень
# Женские:
#   ru_aigul ru_albina ru_alfia ru_alfia2 ru_ekaterina ru_vika ru_karina ru_kermen
#   ru_nurgul ru_oksana ru_onaoy ru_ramilia ru_saida ru_zara ru_zhadyra ru_zhazira ru_zinaida
# Для английского: en_0 ... en_117, random
# Для немецкого  : de_0 ... de_117, random
# =============================================================================
ru_speaker: "ru_roman"
service_speaker: "ru_albina"
en_speaker: "en_102"

# =============================================================================
# Курсив (внутри тэгов <emphasis>)
# =============================================================================
emphasis_as_text: true    # true = как обычный текст, false = выделять голосом и паузами
# Если emphasis_as_text: true, то 4 параметра ниже игнорируются
emphasis_speaker: ru_alexandr # null = основной голос -- для курсива
emphasis_speed: 1.00
emphasis_pause_before: 0
emphasis_pause_after: 0

# =============================================================================
# Аудио
# Частота: 24000, 48000
# Формат: ogg или wav
# Устройство: auto, cuda, cpu
# Громкость LUFS: -23.0 аудиокниги, -16.0 подкасты (null = не нормализовать)
# =============================================================================
sample_rate: 48000
format: "ogg"
device: "auto"
loudness_target: -23.0

# =============================================================================
# Скорость
# =============================================================================
speed: 1.00 # основная
en_speed: 0.95 # для английского

# =============================================================================
# Паузы
# force_punctuation: true = принудительные паузы по знакам препинания
# force_punctuation: false = паузы внутри чанков ставит Silero (рекомендуется)
# =============================================================================
force_punctuation: false
pause_between_sentences: 0.35 # используется при force_punctuation: true
pause_semicolon: 0.15         # используется при force_punctuation: true
pause_colon: 0.1              # используется при force_punctuation: true
pause_comma: 0.05             # используется при force_punctuation: true
pause_between_paragraphs: 0.60
pause_between_chapters: 1.5
en_pause_before: 0.1
en_pause_after: 0.1

# =============================================================================
# Сноски
# =============================================================================
skip_footnotes: false  # true = полностью пропустить сноски
footnote_prefix: "Сно́ска"
footnote_suffix: "Коне́ц сно́ски"
footnote_pause_before: 0.3
footnote_pause_after: 0.3
footnote_force_comma: true  # добавлять запятую перед сноской если нет знака

# =============================================================================
# Финальная фраза
# =============================================================================
final_phrase: "Коне́ц озву́ченного те́кста."

# =============================================================================
# Производительность
# =============================================================================
parallel_threads: 4  # потоков PyTorch на CPU
max_chunk_length: 950  # максимум для Silero ~1000
blocks_per_part: 100  # блоков в одной OGG-части
filter_threads: 4  # не используется

# =============================================================================
# Постобработка pedalboard (pedalboard_enabled: true)
# =============================================================================
pedalboard_enabled: true
pedalboard_room_tone: 0  # 0 = выкл, -48 = тихо, -75 = едва слышно
pb_highpass_hz: 85
pb_deharsh_hz: 5500
pb_deharsh_db: -2.5
pb_deharsh_q: 1.5
pb_deharsh2_hz: 7800
pb_deharsh2_db: -3.0
pb_deharsh2_q: 1.5
pb_lowpass_hz: 11500
pb_warmth_hz: 280
pb_warmth_db: 1.8
pb_clarity_hz: 3200
pb_clarity_db: 1.4
pb_comp_threshold: -18
pb_comp_ratio: 2.4
pb_comp_attack: 18
pb_comp_release: 120
pb_reverb_room: 0.22
pb_reverb_damping: 0.55
pb_reverb_wet: 0.09
pb_reverb_width: 0.6
pb_gain_db: 0.3

# =============================================================================
# Постобработка ffmpeg (альтернатива pedalboard, null = выкл)
# =============================================================================
ffmpeg_filter: null
vorbis_quality: 6

# Мягкий фильтр
#ffmpeg_filter: "highpass=f=60, lowpass=f=14000, acompressor=ratio=2:threshold=-24dB:attack=10:release=100"

# Эквалайзер
