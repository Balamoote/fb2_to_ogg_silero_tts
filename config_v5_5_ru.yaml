# =============================================================================
# Модели
# v5_5_ru_manual: v5_5_ru с поддержкой ручных ударений
# =============================================================================
ru_model: "v5_5_ru_manual"
en_model: "v3_en"

# =============================================================================
# Голоса для v5_5_ru
# Русские голоса: aidar, baya, kseniya, xenia, eugene
# =============================================================================
ru_speaker: "eugene"
service_speaker: "kseniya" # фразы сносок и окончания текста
en_speaker: "en_102"


# =============================================================================
# Авто-ударения и буква ё
# Ручные ударения (формат +гласная или гла́сная) предположительно всегда имеют приоритет
# =============================================================================
put_accent: true           # авто-ударения для слов без разметки
put_yo: false              # авто-расстановка ё
put_stress_homo: false     # авто-ударения для омографов (замок/замок)
put_yo_homo: false         # авто-ё для омографов

# =============================================================================
# Аудио
# =============================================================================
sample_rate: 48000
format: "ogg"
device: "auto"
loudness_target: -23.0

# =============================================================================
# Скорость
# =============================================================================
speed: 1.00
en_speed: 0.95

# =============================================================================
# Паузы
# =============================================================================
force_punctuation: false  # true = принудительные паузы по знакам, false = Silero расставит паузы внутри чанков
ssml_enabled: true        # true = паузы через SSML, false = программные паузы.

pause_between_chapters: 1.5
pause_between_subsections: 0.8
pause_between_paragraphs: 0.60
pause_between_sentences: 0.35
pause_semicolon: 0.15
pause_colon: 0.1
pause_dash: 0.2
pause_comma: 0.05
en_pause_before: 0.1
en_pause_after: 0.1

# =============================================================================
# Курсив (внутри тэгов <emphasis>)
# =============================================================================
emphasis_as_text: true    # true = как обычный текст, false = выделять голосом и паузами
# Если emphasis_as_text: true , то 4 параметра ниже игнорируются ssml_enabled: false
emphasis_speaker: "eugene" # "голос; только при ssml_enabled: false
emphasis_speed: 1.00
emphasis_pitch: "high" # x-low, low, medium, high, x-high (только при ssml_enabled: true)
emphasis_pause_before: 0.1
emphasis_pause_after: 0.1

# =============================================================================
# Сноски
# =============================================================================
skip_footnotes: false  # true = полностью пропустить сноски
footnote_prefix: "Сно́ска"
footnote_suffix: "Коне́ц сно́ски"
footnote_pause_before: 0.3
footnote_pause_after: 0.3
footnote_force_comma: true  # добавлять запятую перед сноской если нет знака

# =============================================================================
# Финальная фраза
# =============================================================================
final_phrase: "Коне́ц озву́ченного те́кста."

# =============================================================================
# Производительность
# =============================================================================
parallel_threads: 4
max_chunk_length: 950
blocks_per_part: 100
filter_threads: 4

# Постобработка pedalboard
# =============================================================================
# Настройки на основе анализа чистого вывода v5_5_ru
# =============================================================================
pedalboard_enabled: true
pedalboard_room_tone: 0
pb_highpass_hz: 85

pb_deharsh_hz: 5500
pb_deharsh_db: -2.5
pb_deharsh_q: 1.5
pb_deharsh2_hz: 7800
pb_deharsh2_db: -3.0
pb_deharsh2_q: 1.5
pb_lowpass_hz: 11500
pb_warmth_hz: 280
pb_warmth_db: 1.8
pb_clarity_hz: 3200
pb_clarity_db: 1.4
pb_comp_threshold: -18
pb_comp_ratio: 2.4
pb_comp_attack: 18
pb_comp_release: 120
pb_reverb_room: 0.22
pb_reverb_damping: 0.55
pb_reverb_wet: 0.09
pb_reverb_width: 0.6
pb_gain_db: 0.3

# Постобработка ffmpeg (null = без обработки)
ffmpeg_filter: null
vorbis_quality: 6
